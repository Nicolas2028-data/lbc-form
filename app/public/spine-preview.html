<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>背骨アニメーション プレビュー</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: linear-gradient(135deg, #f5f7f2 0%, #e8f5ee 60%, #d4eede 100%);
  height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-family: -apple-system, sans-serif; color: #1a2e22;
}
#canvas-host {
  width: 420px; height: 560px;
  background: linear-gradient(135deg, #f5f7f2 0%, #e8f5ee 60%, #d4eede 100%);
  border-radius: 20px; overflow: hidden;
}
p { margin-top: 18px; font-size: 0.9rem; color: rgba(26,46,34,0.55); letter-spacing: 0.08em; }
</style>
</head>
<body>
<div id="canvas-host"></div>
<p>マウスを動かすと傾きます</p>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

const el = document.getElementById('canvas-host');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'low-power' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setClearColor(0x000000, 0);
el.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

// ライティング
scene.add(new THREE.AmbientLight(0xdff0e8, 0.7));

const keyDir = new THREE.DirectionalLight(0xffffff, 2.8);
keyDir.position.set(-4, 8, 7); scene.add(keyDir);

const fillLight = new THREE.PointLight(0x74c69d, 60, 35);
fillLight.position.set(6, 0, 5); scene.add(fillLight);

const rimLight = new THREE.PointLight(0xb7e4c7, 90, 25);
rimLight.position.set(2, 4, -8); scene.add(rimLight);

const bottomLight = new THREE.PointLight(0x52b788, 30, 20);
bottomLight.position.set(0, -8, 3); scene.add(bottomLight);

// マテリアル
const boneMat = new THREE.MeshStandardMaterial({
  color: 0xf0ede8, roughness: 0.45, metalness: 0.05,
  emissive: new THREE.Color(0x0a1a10), emissiveIntensity: 0.12,
});
const discMat = new THREE.MeshStandardMaterial({
  color: 0xc8e0d0, roughness: 0.55, metalness: 0.02,
  emissive: new THREE.Color(0x0a2518), emissiveIntensity: 0.18,
});

const spine = new THREE.Group(); scene.add(spine);

const segments = [];
for (let i = 0; i < 7; i++)  { const t = i/6;  segments.push({ r: 0.18+t*0.04, h: 0.30, z:  0.7-t*1.0 }); }
for (let i = 0; i < 12; i++) { const t = i/11; segments.push({ r: 0.22+t*0.06, h: 0.32, z: -0.3-Math.sin(t*Math.PI)*0.8 }); }
for (let i = 0; i < 5; i++)  { const t = i/4;  segments.push({ r: 0.30+t*0.04, h: 0.36, z: -0.1+t*0.75 }); }

const totalH = segments.reduce((s, seg) => s + seg.h + 0.12, 0);
let y = totalH / 2;

for (const seg of segments) {
  y -= seg.h / 2;

  const body = new THREE.Mesh(new THREE.CylinderGeometry(seg.r, seg.r*1.05, seg.h, 20), boneMat);
  body.position.set(0, y, seg.z); spine.add(body);

  const procR = seg.r * 0.22, procL = seg.r * 1.3 + procR;
  for (const side of [-1, 1]) {
    const m = new THREE.Mesh(new THREE.CylinderGeometry(procR, procR*0.75, procL, 8), boneMat);
    m.rotation.z = Math.PI/2;
    m.position.set(side*(procL/2+seg.r*0.05), y, seg.z-seg.r*0.3);
    spine.add(m);
  }

  const sp = new THREE.Mesh(new THREE.CylinderGeometry(procR*0.75, procR, seg.r*1.8, 8), boneMat);
  sp.rotation.x = Math.PI/2;
  sp.position.set(0, y, seg.z - seg.r - seg.r*0.9); spine.add(sp);

  y -= seg.h/2;
  const dh = 0.10;
  const disc = new THREE.Mesh(new THREE.CylinderGeometry(seg.r*1.1, seg.r*1.1, dh, 20), discMat);
  disc.position.set(0, y-dh/2, seg.z); spine.add(disc);
  y -= dh + 0.02;
}

const sac = new THREE.Mesh(new THREE.CylinderGeometry(0.40, 0.28, 0.55, 20), boneMat);
sac.position.set(0, y-0.28, 0.35); spine.add(sac);

// パーティクル
const N = 18;
const pPos = new Float32Array(N * 3);
const pSeed = new Float32Array(N * 3);
for (let i = 0; i < N; i++) {
  pSeed[i*3+0] = Math.random() * Math.PI * 2;
  pSeed[i*3+1] = 0.4 + Math.random() * 0.6;
  pSeed[i*3+2] = 1.2 + Math.random() * 1.0;
  pPos[i*3+0] = (Math.random()-0.5)*2.5;
  pPos[i*3+1] = (Math.random()-0.5)*totalH*0.9;
  pPos[i*3+2] = (Math.random()-0.5)*2.0;
}
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pMat = new THREE.PointsMaterial({ color: 0x52b788, size: 0.08, transparent: true, opacity: 0.45, sizeAttenuation: true });
scene.add(new THREE.Points(pGeo, pMat));

// カメラ
const resize = () => {
  const w = el.clientWidth, h = el.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(h, 1);
  camera.position.set(0, 1.5, 18);
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();
};
new ResizeObserver(resize).observe(el); resize();

let tx = 0, ty = 0;
el.addEventListener('pointermove', e => {
  const r = el.getBoundingClientRect();
  tx = ((e.clientX-r.left)/r.width - 0.5)*0.4;
  ty = ((e.clientY-r.top)/r.height - 0.5)*0.2;
});

const posArr = pGeo.attributes.position.array;
spine.rotation.y = Math.PI * 0.15;

const tick = now => {
  requestAnimationFrame(tick);
  const t = now/1000;
  spine.rotation.y += 0.003 + (tx*0.8 - spine.rotation.y*0.1)*0.04;
  spine.rotation.x += (ty*0.3 - spine.rotation.x)*0.03;
  spine.position.y = Math.sin(t*0.3)*0.12;

  for (let i = 0; i < N; i++) {
    const ao = pSeed[i*3+0], sp2 = pSeed[i*3+1], rad = pSeed[i*3+2];
    posArr[i*3+0] = Math.cos(t*sp2*0.3+ao)*rad;
    posArr[i*3+2] = Math.sin(t*sp2*0.25+ao)*rad*0.6;
    posArr[i*3+1] += Math.sin(t*sp2*0.5+ao)*0.002;
    if (posArr[i*3+1] >  totalH*0.55) posArr[i*3+1] = -totalH*0.55;
    if (posArr[i*3+1] < -totalH*0.55) posArr[i*3+1] =  totalH*0.55;
  }
  pGeo.attributes.position.needsUpdate = true;
  renderer.render(scene, camera);
};
requestAnimationFrame(tick);
</script>
</body>
</html>
